  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    // ==================== Mobile Navigation Drawer Interaction ====================
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const closeMobileMenuBtn = document.getElementById('closeMobileMenuBtn');
    const mobileSidebar = document.getElementById('mobileSidebar');
    const mobileSidebarOverlay = document.getElementById('mobileSidebarOverlay');
    const desktopNavLinks = document.getElementById('desktopNavLinks');
    const mobileNavLinks = document.getElementById('mobileNavLinks');

    // Clone desktop sidebar layout link properties instantly into mobile layout container
    mobileNavLinks.innerHTML = desktopNavLinks.innerHTML;

    const toggleMobileDrawer = (isOpen) => {
      if (isOpen) {
        mobileSidebarOverlay.classList.remove('hidden');
        setTimeout(() => mobileSidebarOverlay.classList.add('opacity-100'), 10);
        mobileSidebar.classList.remove('-translate-x-full');
      } else {
        mobileSidebarOverlay.classList.remove('opacity-100');
        mobileSidebar.classList.add('-translate-x-full');
        setTimeout(() => mobileSidebarOverlay.classList.add('hidden'), 300);
      }
    };

    mobileMenuBtn.addEventListener('click', () => toggleMobileDrawer(true));
    closeMobileMenuBtn.addEventListener('click', () => toggleMobileDrawer(false));
    mobileSidebarOverlay.addEventListener('click', () => toggleMobileDrawer(false));


    // ==================== Hisend Configuration ====================
    const API_KEY = "4whxTesomK1gZ5cBq9Hk8OIy";
    const PROJECT_ID = "01jttgwp4nq5n4az3f3gc4hry1";
    const TABLE_ID = "f";
    const BASE_URL = "https://core.hisend.hunnovate.com/api/v1";

    let user = {};

    const renderUserData = (user) => {
      const elements = document.querySelectorAll('.full_name');

      elements.forEach((el) => {
        el.innerHTML = `${user.last_name} ${user.first_name}`;
      });
    };

    const getAuthUser = async () => {
      try {
        const token = localStorage.getItem('token');

        if (!token) {
          console.error("No token found");
          return;
        }

        const response = await axios.get(
          `${BASE_URL}/projects/${PROJECT_ID}/auth/user?api_key=${API_KEY}`,
          {
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );

        user = response.data.data;
        renderUserData(user);
      } catch (error) {
        console.error(error.response?.data || error.message);
      }
    };

    getAuthUser();

    const renderQuestionList = async (questions) => {
      const questionContainer = document.getElementById('questionContainer');

      questions.forEach(question => {
        questionContainer.innerHTML += `<details
          class="group bg-white rounded-2xl outline-1 hover:shadow-md overflow-hidden transition-all duration-300">
          <summary
            class="flex justify-between items-center cursor-pointer p-6 text-lg font-semibold text-gray-800 hover:text-primary transition-colors">
            <span>${question.questions}</span>
            <span class="text-2xl font-bold group-open:rotate-180 transition-transform duration-300">+</span>
          </summary>
          <div class="px-6 pb-8 pt-4 text-gray-600 leading-relaxed border-t-2 border-gray-300">${question.answers}</div>
        </details>`;
      });
    };

    const getQuestion = async (e) => {
      const response = await axios.get(`https://core.hisend.hunnovate.com/api/v1/projects/01jttgwp4nq5n4az3f3gc4hry1/tables/01krdvdr8ct06r3yxp50krm4ph/records?page=1&api_key=4whxTesomK1gZ5cBq9Hk8OIy`);
      renderQuestionList(response.data.data);
    };

    getQuestion();
  </script>
