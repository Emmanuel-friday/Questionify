  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>

    const TABLE_ID = "01kqcqcjyexsfs4y0bbwf7hc7r";
    const API_KEY = "4whxTesomK1gZ5cBq9Hk8OIy";
    const PROJECT_ID = "01jttgwp4nq5n4az3f3gc4hry1";
    const BASE_URL = "https://core.hisend.hunnovate.com/api/v1";


    let user = {};

    const renderUserData = (user) => {
      const elements = document.querySelectorAll('.full_name');

      elements.forEach((el) => {
        el.innerHTML = `${user.last_name} ${user.first_name}`;
      });
    };

    const getAuthUser = async () => {
      try {
        const token = localStorage.getItem('token');

        if (!token) {
          console.error("No token found");
          return;
        }

        const response = await axios.get(
          `${BASE_URL}/projects/${PROJECT_ID}/auth/user?api_key=${API_KEY}`,
          {
            headers: {
              Authorization: `Bearer ${token}`
            }
          }
        );

        // console.log(response.data.data);
        user = response.data.data
        renderUserData(user)
      } catch (error) {
        console.error(error.response?.data || error.message);
      }
    };

    getAuthUser();

    const renderSubjectList = async (subjects) => {
      const subjectContainer = document.getElementById('subjectContainer');

      subjects.forEach(subject => {
        subjectContainer.innerHTML += `<div
          class="group bg-white p-6 rounded-2xl shadow-md hover:shadow-xl hover:scale-105 transition-all duration-300 text-center cursor-pointer">
          <img src="${subject.icon}"
            alt="English Language"
            class="mx-auto mb-4 w-16 h-16 object-contain rounded-full bg-gradient-to-br from-green-100 to-green-200 p-3 shadow-sm" />
          <h4 class="text-lg font-semibold text-gray-800 group-hover:text-primary transition-colors"> ${subject.name}
          </h4>
        </div>`;
      })
    }

    const getSubjects = async (e) => {
      const response = await axios.get(`${BASE_URL}/projects/hi_sense/tables/${TABLE_ID}/records?api_key=${API_KEY}`);
      renderSubjectList(response.data.data);
    };

    getSubjects();


  </script>
